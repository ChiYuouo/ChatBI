[project]
name = "chatbi-mvp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.4.2",
    "numpy>=2.5.2",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
