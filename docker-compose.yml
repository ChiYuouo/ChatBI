name: chatbi

services:
  # ---------- MySQL：首次启动自动导入 chatbi_mvp 的表结构与数据 ----------
  mysql:
    image: mysql:8.4
    container_name: chatbi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      MYSQL_DATABASE: ${DB_NAME:-chatbi_mvp}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - chatbi-mysql-data:/var/lib/mysql
      # 目录里所有 .sql 会在数据目录首次初始化时按文件名顺序执行
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 宿主机映射到 3307，避免和本机已有的 3306 实例冲突
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  # ---------- 后端：FastAPI + ChromaDB ----------
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: chatbi-backend:latest
    container_name: chatbi-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 容器内走 compose 网络，主机名就是服务名 mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-chatbi_mvp}
      # LLM 配置透传自 .env
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3-max}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      # 前端已经走 Nginx 同源反代，这里只是兜底放开直连调试
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      TZ: Asia/Shanghai
    volumes:
      # Persist SQLite session history on the host so it survives container rebuilds
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------- 前端：Vite 构建产物 + Nginx，并同源反代 /backend 到后端 ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: chatbi-frontend:latest
    container_name: chatbi-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  chatbi-mysql-data:
