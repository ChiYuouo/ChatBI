server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源与 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源反向代理到后端，浏览器无需跨域
    # 前端读 config.js 的 apiBaseUrl=/backend，请求形如 /backend/api/v1/query
    location /backend/ {
        # 用变量 + Docker 内嵌 DNS，避免后端未就绪时 nginx 启动直接失败
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $chatbi_backend http://backend:8000;
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass $chatbi_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式接口（/api/v1/query/stream）必需：
        # 关掉缓冲，否则 Nginx 会攒满才吐给浏览器，逐字输出效果会消失
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
